<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><polygon points=%2750,12 90,88 10,88%27 fill=%27%237c3aed%27/></svg>">
<meta property="og:title" content="contacts — nostr-client">
<meta property="og:description" content="Follow buttons and contact lists that preserve what they do not understand.">
<meta property="og:url" content="https://nostr-client.github.io/contacts/">
<meta property="og:image" content="https://nostr-client.github.io/contacts/og.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="nostr-client">
<meta name="twitter:card" content="summary_large_image">
<title>contacts — follow list demo</title>
<link rel="stylesheet" href="https://nostr-client.github.io/theme/theme.css">
<style>
  body { max-width: 42rem; margin: 2.5rem auto; padding: 0 1.2rem 4rem; }
  h1 { font-size: 1.4rem; } h1 a { text-decoration: none; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
  section { margin: 1.6rem 0; }
  .try { display: flex; align-items: center; gap: .8rem; padding: .7rem .9rem;
    background: var(--nc-surface); border: 1px solid var(--nc-line);
    border-radius: var(--nc-radius-sm); }
</style>
</head>
<body>
<header>
  <h1><a href="https://github.com/nostr-client/contacts">nostr-client / contacts</a></h1>
  <nostr-login></nostr-login>
</header>

<section>
  <p class="nc-muted">A follow button for any pubkey (updates your kind-3
  contact list, preserving petnames/relays/content it doesn't understand):</p>
  <div class="try">
    <span>jack</span>
    <nostr-follow-button pubkey="82341f882b6eabcd2ba7f1ef90aad961cf074af15b9ef44a09f9d2a8fbfbe6a2"></nostr-follow-button>
  </div>
</section>

<section>
  <p class="nc-muted">…and your whole contact list:</p>
  <nostr-contacts></nostr-contacts>
</section>

<script type="module">
  import 'https://nostr-client.github.io/login/login.js'
  import './contacts.js'
</script>
</body>
</html>
